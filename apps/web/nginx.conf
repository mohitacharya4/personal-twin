server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache hashed assets aggressively; never cache the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the backend service. SSE needs buffering disabled so events
    # reach the browser as they are produced.
    location /chat {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /ingest {
        proxy_pass http://api:8000;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://api:8000;
    }
}
