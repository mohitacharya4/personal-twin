[project]
name = "twin-rag"
version = "0.1.0"
description = "The Personal Twin RAG pipeline — sources, chunking, embeddings, vector store, retrieval, generation"
requires-python = ">=3.12"
dependencies = [
    "twin-config",
    "twin-observability",
    "pydantic>=2.9.0",
    "pyyaml>=6.0.2",
    "langchain-core>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "langchain-ollama>=0.2.0",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3.0"]
openai = ["langchain-openai>=0.2.0"]
pgvector = ["psycopg[binary]>=3.2.0", "pgvector>=0.3.0"]

[tool.uv.sources]
twin-config = { workspace = true }
twin-observability = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twin_rag"]
